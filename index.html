<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0f">
  <title>AstroStrata: Reignition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Mobile Portrait Orientation Blocker -->
  <div id="rotate-device-overlay">
    <div class="phone-icon">📱</div>
    <h2>Rotate Your Device</h2>
    <p>AstroStrata requires landscape mode for touch controls and exploration.</p>
  </div>

  <!-- Primary Application Wrapper -->
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Initial Loading & Audio Bootstrap Modal -->
    <div id="loading-overlay">
      <div class="loader-content">
        <h1>ASTROSTRATA: REIGNITION</h1>
        <p>Stratum Geology · Planetary Dynamos · Interplanetary Aerospace</p>
        <button id="start-btn" type="button">INITIALIZE EXPEDITION</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
